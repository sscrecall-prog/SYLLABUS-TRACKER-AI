<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4026" />
      <stop offset="100%" stop-color="#052E1B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#DAA520" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle with Gold Border -->
  <rect x="4" y="4" width="100" height="100" rx="22" ry="22" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Sparkle Stars in Gold -->
  <path fill="url(#goldGrad)" d="M24,20 L25.2,23.8 L29,25 L25.2,26.2 L24,30 L22.8,26.2 L19,25 L22.8,23.8 Z" />
  <path fill="url(#goldGrad)" d="M84,24 L84.8,26.2 L87,27 L84.8,27.8 L84,30 L83.2,27.8 L81,27 L83.2,26.2 Z" />

  <!-- 1. Background Calendar (Top Center) -->
  <rect x="34.5" y="18" width="39" height="25.5" rx="3" ry="3" fill="#052E1B" />
  <!-- Calendar Rings (Gold) -->
  <rect x="40.2" y="14" width="3.6" height="7.8" rx="1.8" ry="1.8" fill="url(#goldGrad)" />
  <rect x="52.2" y="14" width="3.6" height="7.8" rx="1.8" ry="1.8" fill="url(#goldGrad)" />
  <rect x="64.2" y="14" width="3.6" height="7.8" rx="1.8" ry="1.8" fill="url(#goldGrad)" />
  <!-- Calendar Page Fill (Cream) -->
  <path fill="#FFF8E7" d="M36.5,24 L71.5,24 L71.5,41.5 C71.5,42.5 70.5,43.5 69.5,43.5 L38.5,43.5 C37.5,43.5 36.5,42.5 36.5,41.5 Z" />
  <!-- Calendar Checkmark (Gold/Green) -->
  <path fill="#00A86B" d="M51,34.5 L47.5,31 L45.5,33 L51,38.5 L60.5,29 L58.5,27 Z" />

  <!-- 2. Analog Clock (Top Right) -->
  <circle cx="76" cy="41" r="11" fill="url(#goldGrad)" />
  <circle cx="76" cy="41" r="9" fill="#FFF8E7" />
  <path stroke="#0B4026" stroke-width="1.8" stroke-linecap="round" d="M76,41 L76,36 M76,41 L80,43" />

  <!-- Leaves (Left) -->
  <path fill="#228B22" d="M18,30 C18,30 26,34 27,42 C19,42 18,30 18,30 Z" />
  <path fill="#32CD32" d="M20,38 C20,38 28,40 30,48 C22,48 20,38 20,38 Z" />

  <!-- 3. Open Book in Center -->
  <!-- Left Page (Cream) -->
  <path fill="#FFFDF7" d="M24,43 C33,41 49,44 51,46 L51,72 C49,70 33,67 24,69 Z" />
  <!-- Right Page (Cream) -->
  <path fill="#FFF8E1" d="M80,43 C71,41 55,44 53,46 L53,72 C55,70 71,67 80,69 Z" />
  <!-- Book Spine/Cover Rim -->
  <path fill="#052E1B" d="M23,69.5 L51,72.5 L53,72.5 L81,69.5 L81,71 C71,69 55,72 52,74 C49,72 33,69 23,71 Z" />
  <rect x="51" y="45.5" width="2" height="28" fill="url(#goldGrad)" />

  <!-- Left Page Checklist Content -->
  <path fill="#00A86B" d="M29,48.5 L31,50.5 L35,46.5 L36.5,48 L31,53.5 L27.5,50 Z" />
  <path fill="#00A86B" d="M29,56.5 L31,58.5 L35,54.5 L36.5,56 L31,61.5 L27.5,58 Z" />

  <!-- Right Page Bar Chart Content (Green & Gold) -->
  <rect x="58" y="56" width="3" height="7" fill="#00A86B" />
  <rect x="63" y="52" width="3" height="11" fill="url(#goldGrad)" />
  <rect x="68" y="48" width="3" height="15" fill="#0B4026" />

  <!-- 4. Front Checkmark Badge (Gold Border + Green Circle) -->
  <circle cx="71" cy="79" r="12" fill="url(#goldGrad)" />
  <circle cx="71" cy="79" r="10" fill="#00A86B" />
  <path fill="#FFF8E7" d="M69.5,82 L66,78.5 L64,80.5 L69.5,86 L77.5,78 L75.5,76 Z" />

  <!-- 5. Main Title Pill Banner ("Syllabus") -->
  <rect x="11" y="75" width="56" height="14" rx="7" ry="7" fill="#052E1B" stroke="url(#goldGrad)" stroke-width="1.2" />
  <text x="39" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8.5" fill="#FFF8E7" text-anchor="middle">Syllabus</text>

  <!-- 6. Secondary Pill Banner ("-Tracker-") -->
  <rect x="21" y="88" width="34" height="9" rx="4.5" ry="4.5" fill="url(#goldGrad)" />
  <text x="38" y="94.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="6" fill="#052E1B" text-anchor="middle">Tracker</text>
</svg>
