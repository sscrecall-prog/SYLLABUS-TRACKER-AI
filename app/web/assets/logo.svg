<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <defs>
    <!-- Rich Emerald Green Gradient matching uploaded image -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B7B47" />
      <stop offset="50%" stop-color="#126337" />
      <stop offset="100%" stop-color="#073B20" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D depth -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="4" y="4" width="100" height="100" rx="24" ry="24" fill="url(#logoBg)" />

  <!-- Pure White Open Book & Checkmark Symbol -->
  <g filter="url(#logoShadow)">
    <!-- 1. Secondary Back-Page Layer (Bottom Left Shadow Page) -->
    <path fill="#E2F5E9" d="M 25,36 C 25,36 23.5,63 23.5,66 C 23.5,68.5 25.5,70.5 29,69.5 C 36,67.5 47,62 52,59.5 L 52,55 C 46,58 35.5,63 29.5,64.5 L 29.5,36 Z" />

    <!-- 2. Main Open Book Body (Left Page, Right Page & Checkmark Base) -->
    <path fill="#FFFFFF" fill-rule="evenodd" d="
      M 28,30 
      C 28,28.8 29.8,28 31.5,28.6 
      C 39.5,30.8 49,36 53.5,39 
      C 58,36 67.5,30.8 75.5,28.6 
      C 77.2,28 79,28.8 79,30 
      L 79,40 
      C 79,41 78.2,41.8 77.2,42.2 
      C 70,45 60,50 56,54 
      L 56,59 
      C 63,52 74,44 83,39 
      C 84.5,38.2 86,39.5 85.2,41 
      L 58.5,80.5 
      C 57.2,82.5 54.8,82.8 53.2,81.2 
      L 48,76 
      C 46.8,74.8 46.8,72.8 48,71.6 
      C 49.2,70.4 51.2,70.4 52.4,71.6 
      L 55,74.2 
      L 52,59.5 
      L 52,43 
      C 47.5,39.5 37.5,34 30.8,31.2 
      C 29.2,30.5 28,31.5 28,33 
      L 28,60 
      C 28,62 29.5,63.5 32.5,63.2 
      C 39,62.5 48.5,58 52,55 
      L 52,66.5 
      C 48,69 38,73.5 30.5,73.8 
      C 26,74 23.5,71 23.5,66 
      L 23.5,36 
      Z
    " />

    <!-- 3. Simplified Precise Single-Path High Contrast White Emblem -->
    <!-- Left Page Body -->
    <path fill="#FFFFFF" d="
      M 27.5,30 
      C 27.5,28.8 29,28 31,28.8 
      C 39,31 48,36 53,39.2 
      L 53,74 
      C 48,70 37,64.5 30.5,64.5 
      C 28.5,64.5 27.5,63.2 27.5,61 
      Z" />

    <!-- Left Page Slot 1 -->
    <rect x="32" y="37" width="13" height="3" rx="1.5" fill="#126337" />
    <!-- Left Page Slot 2 -->
    <rect x="32" y="44" width="13" height="3" rx="1.5" fill="#126337" />
    <!-- Left Page Slot 3 -->
    <rect x="32" y="51" width="13" height="3" rx="1.5" fill="#126337" />

    <!-- Top Right Page -->
    <path fill="#FFFFFF" d="
      M 55,39.2 
      C 60,36 69,31 77,28.8 
      C 79,28 80.5,28.8 80.5,30 
      L 80.5,41 
      C 80.5,42 79.5,42.8 78.5,43.2 
      C 71,46 60,51.5 55,56 
