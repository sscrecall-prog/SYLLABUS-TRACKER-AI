<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F5E36" />
      <stop offset="100%" stop-color="#05331C" />
    </linearGradient>

    <!-- Gold Checkmark Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#E69500" />
    </linearGradient>

    <!-- White 'S' Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Green Squircle Base -->
  <rect x="4" y="4" width="100" height="100" rx="24" ry="24" fill="url(#bgGrad)" />

  <!-- Gold Checkmark inside the upper loop of 'S' -->
  <path fill="url(#goldGrad)" filter="url(#dropShadow)" d="M47,40.5 L53,46.5 L65.5,34 C67,32.5 69,32.5 70,34 C71.2,35.2 71.2,37 69.8,38.5 L55.2,53 C54,54.2 52,54.2 50.8,53 L42.5,44.7 C41.2,43.4 41.2,41.5 42.5,40.2 C43.8,39 45.8,39 47,40.5 Z" />

  <!-- White Stylized 'S' Ribbon with Book Fold at Bottom -->
  <g filter="url(#dropShadow)">
    <!-- Main Ribbon Spine 'S' -->
    <path fill="#FFFFFF" d="
      M 40,24 
      C 60,24 77,28 77,38
      C 77,48 50,47 40,53
      C 30,59 30,73 40,82
      C 52,91 66,88 66,88
      C 68,87.5 70,89 70,91
      C 70,93 68,94 64,95.5
      C 48,100 24,91 24,76
      C 24,61 48,58 60,52
      C 70,47 67,33 52,32
      C 41,31 38,36 38,36
      C 36.5,37.5 34,37 33,35
      C 32,33 33,30 36,28
      C 40,25 40,24 40,24 Z" />

    <!-- Folded Book Pages at Bottom Left of 'S' -->
    <path fill="#F0FDF4" d="M 28,76 C 28,70 38,64 54,64 L 56,71 C 42,71 34,75 34,80 Z" />
    
    <!-- Page Book Lines (Green) -->
    <rect x="36" y="67" width="12" height="2" rx="1" fill="#15803D" />
    <rect x="36" y="71" width="16" height="2" rx="1" fill="#15803D" />
    
    <!-- Leaf Green Fold Accent at bottom page corner -->
    <path fill="#4ADE80" d="M 28,76 C 28,81 32,84 37,84 C 33,84 30,81 28,76 Z" />
  </g>
</svg>
