<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus Tracker - Web App</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b4d3e">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Sidebar Navigation for Desktop/Tablet -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo" style="width: 38px; height: 38px; border-radius: 10px; overflow: hidden; background: transparent; padding: 0;">
          <img src="assets/logo.svg" alt="Syllabus Tracker Logo" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        <div class="brand-text">
          <span class="brand-name">Syllabus Tracker</span>
          <span class="brand-tag">WEB VERSION</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Navigation items rendered dynamically -->
      </nav>

      <div class="sidebar-footer" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div class="theme-selector-container">
          <span class="theme-label">THEME</span>
          <div class="theme-swatches" id="theme-swatches">
            <button class="theme-swatch swatch-light" data-theme-val="light" title="Light Mode"></button>
            <button class="theme-swatch swatch-warm" data-theme-val="warm" title="Warm Cream Mode"></button>
            <button class="theme-swatch swatch-dark" data-theme-val="dark" title="Dark Mode"></button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Top Header Bar -->
      <header class="top-bar">
        <button class="mobile-menu-btn" id="mobile-menu-btn" title="Toggle Menu">
          <span class="material-symbols-outlined">menu</span>
        </button>

        <div class="page-title-container">
          <h1 id="page-title">Dashboard</h1>
          <span class="page-subtitle" id="page-subtitle">SSC CGL 2026 Target</span>
        </div>

        <div class="top-bar-actions">
          <div class="top-streak-badge" id="top-streak">
            🔥 <span id="top-streak-count">0</span>d
          </div>

          <button class="top-action-btn" id="top-timer-btn" title="Study Timer">
            <span class="material-symbols-outlined">timer</span>
          </button>

          <button class="top-action-btn profile-btn" id="top-profile-btn" title="User Profile">
            <span id="user-avatar-emoji">🎯</span>
          </button>
        </div>
      </header>

      <!-- Dynamic Screen Content View -->
      <main class="content-container" id="content-area">
        <!-- Screen components injected here -->
      </main>

      <!-- Bottom Navigation Bar for Mobile -->
      <nav class="bottom-nav" id="bottom-nav">
        <!-- Dynamic mobile navigation items -->
      </nav>
    </div>

    <!-- Global Floating Action Button -->
    <button class="fab-btn" id="global-fab" title="Quick Add">
      <span class="material-symbols-outlined">add</span>
      <span class="fab-label">Quick Add</span>
    </button>
  </div>

  <!-- Global Modal Container -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-card" id="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Modal Title</h3>
        <button class="modal-close-btn" id="modal-close-btn">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Modal form content -->
      </div>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application JavaScript Stack -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
